name: Windows Build, Tests und Installer
on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/ThunderClient.Tests/ThunderClient.Tests.csproj
      - name: Test (nur Mocks, keine GPU/Downloads)
        run: dotnet test tests/ThunderClient.Tests/ThunderClient.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=thunderclient-tests.trx" --results-directory artifacts/testresults
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute embedded remote readiness against synthetic file and HTTP fixtures
        run: python -m unittest discover -s tests -p remote_readiness_fixture_test.py -v
      - name: Publish Desktop App
        run: dotnet publish src/ThunderClient/ThunderClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish
      - name: GUI-Starttest auf Windows (ohne Netzwerk/GPU)
        shell: powershell
        run: |
          $exe = (Resolve-Path "artifacts/publish/ThunderClient.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--ui-smoke-test" -PassThru
          $log = Join-Path $env:LOCALAPPDATA "ThunderClient\logs\startup.log"
          if (-not $p.WaitForExit(15000)) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "GUI startete nicht oder lieferte kein ContentRendered innerhalb von 15 Sekunden."
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "GUI-Starttest fehlgeschlagen (Exitcode $($p.ExitCode))."
          }
      - name: Install Inno Setup
        shell: powershell
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
      - name: Build Installer
        shell: powershell
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          & $iscc "installer\ThunderClient.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate SHA-256
        shell: powershell
        run: |
          Get-ChildItem artifacts/installer/*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding Ascii artifacts/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thunder-client-windows
          path: |
            artifacts/installer/
            artifacts/testresults/
          if-no-files-found: warn

  remote-supervisor-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Detached remote bootstrap, reattach, complete stdout and secret-free persisted script
        run: bash tests/RemoteSupervisorHarness/smoke.sh

  release:
    # Erst nach erfolgreichen Windows- und Linux-Tests auf einem expliziten
    # Release-Merge in main. Ein normales Feature-Commit publiziert nie automatisch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-v0.1.1]')
    needs: [windows, remote-supervisor-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: thunder-client-windows
          path: artifacts
      - name: Prüfe Installer-Datei und SHA-256 gegen die CI-Artefakte
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/installer/ThunderClient-Setup-0.1.1-win-x64.exe
          test -f artifacts/installer/SHA256SUMS.txt
          test "$(find artifacts/installer -maxdepth 1 -name 'ThunderClient-Setup-*.exe' | wc -l)" -eq 1
          (cd artifacts/installer && sha256sum -c SHA256SUMS.txt)
      - name: Verhindere versehentliches Überschreiben vorhandener Tags/Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.1" >/dev/null 2>&1; then
            echo "v0.1.1 existiert bereits; keine automatische Überschreibung." >&2
            exit 1
          fi
          if gh release view v0.1.1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.1 existiert bereits." >&2
            exit 1
          fi
      - name: Veröffentliche GitHub Release mit Installer und Prüfsumme
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: ${{ github.sha }}
          name: Thunder Compute Client v0.1.1 (Windows)
          prerelease: false
          make_latest: true
          draft: false
          body_path: docs/RELEASE_NOTES_v0.1.1.md
          files: |
            artifacts/installer/ThunderClient-Setup-0.1.1-win-x64.exe
            artifacts/installer/SHA256SUMS.txt
          fail_on_unmatched_files: true
